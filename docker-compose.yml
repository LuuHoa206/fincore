services:
  postgres:
    image: postgres:18-alpine
    container_name: fincore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fincore}
      POSTGRES_USER: ${POSTGRES_USER:-fincore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fincore-local-only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - fincore-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fincore} -d ${POSTGRES_DB:-fincore}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fincore-postgres-data:
