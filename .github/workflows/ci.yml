name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        run: bash ./mvnw test

  database-integration:
    name: PostgreSQL migration integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      RUN_INTEGRATION_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Confirm Docker is available for Testcontainers
        run: docker version --format '{{.Server.Version}}'
      - name: Verify PostgreSQL, Flyway, JPA schema and financial concurrency
        run: bash ./mvnw test "-Dtest=FinCoreBackendApplicationTests,DatabaseMigrationIntegrationTests,TransactionConcurrencyIntegrationTests"

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  container-build:
    name: Container build (${{ matrix.service }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            file: ./backend/Dockerfile
          - service: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: fincore-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  production-compose-contract:
    name: Production Compose contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      POSTGRES_DB: fincore_ci
      POSTGRES_USER: fincore_ci
      POSTGRES_PASSWORD: ci-only-password-not-a-secret
      JWT_SECRET: ci-only-jwt-secret-with-at-least-thirty-two-characters
      CORS_ALLOWED_ORIGINS: https://fincore-ci.example.test
      VITE_API_BASE_URL: /api/v1
      APP_PORT: 18080
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose contract
        run: docker compose -f docker-compose.production.yml config --quiet
